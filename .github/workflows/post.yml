name: Post due reels

on:
  schedule:
    # Stündlich (Minute 7). Seit dem 20.11. ließ GitHub die geplanten Läufe um 12:00 und 18:00 aus (nur ein Lauf pro Nacht),
    # dadurch staute sich die Queue. Mit stündlichen Läufen kommt mindestens einer pro Slot durch; ohne Fälliges tut der Lauf nichts.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPOST_PAT: ${{ secrets.AUTOPOST_PAT }}
          INSTAGRAM_TOKEN_GTA: ${{ secrets.INSTAGRAM_TOKEN_GTA }}
          INSTAGRAM_TOKEN_CATS: ${{ secrets.INSTAGRAM_TOKEN_CATS }}
          INSTAGRAM_TOKEN_TRADING: ${{ secrets.INSTAGRAM_TOKEN_TRADING }}
        run: python post_due.py
      - name: Save status
        if: always()
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add queue state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "status update" && git pull --rebase && git push)
